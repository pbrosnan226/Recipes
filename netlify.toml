# Netlify settings for the recipe site. The code lives in site/; the notes are read from the repo root.
# The build is site/build-shell.js (page shell only). It reads SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY from the Netlify settings.
# `base` makes Netlify build from site/ with no Base directory setting in the dashboard.
# Paths below (publish) are relative to the base directory, so the output is site/dist.

[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Old recipe addresses (S-60): /recipes/<slug>.html -> /recipe?name=<slug>
# Netlify's placeholder matches a whole path segment (the docs don't promise ":slug.html" splits at the dot), so the rule
# uses ":slug" and passes "<slug>.html" on; the Recipe page (site/static/recipe-page.js) drops the ".html" and tidies the address.
[[redirects]]
  from = "/recipes/:slug"
  to = "/recipe?name=:slug"
  status = 301
